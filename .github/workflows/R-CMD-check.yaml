# Based on https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: ${{ matrix.config.timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release', manual: true, native: true, timeout: 90}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release', timeout: 90}
          - {os: ubuntu-latest, r: '4.3'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_CRAN_INCOMING_: ${{ matrix.config.manual && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: matrix.config.manual
      - name: Install PDF-manual fonts
        if: matrix.config.manual
        run: |
          tlmgr update --self
          tlmgr install inconsolata collection-fontsrecommended
        shell: bash
      - name: Install HTML-manual validator
        if: matrix.config.manual
        run: |
          sudo apt-get update
          sudo apt-get install --yes tidy
          tidy --version
        shell: bash
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          # Binary RStan installations can omit LinkingTo-only dependencies,
          # although runtime Stan compilation still needs their headers.
          extra-packages: ${{ matrix.config.native && 'any::rcmdcheck, any::BH, any::RcppEigen' || 'any::rcmdcheck' }}
          dependencies: '"all"'
          needs: check
      - name: Verify check prerequisites
        run: Rscript .github/scripts/check-prerequisites.R
        shell: bash
      - name: Verify runtime Stan compilation headers
        if: matrix.config.native
        run: Rscript .github/scripts/check-stan-prerequisites.R
        shell: bash
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--no-manual", "--as-cran")' }}
          build_args: ${{ matrix.config.manual && 'character()' || '"--no-manual"' }}
          error-on: '"warning"'
          check-dir: '"check"'
          upload-results: 'true'
          artifact-name: check-${{ matrix.config.os }}-${{ matrix.config.r }}
      - name: Execute README against the checked package
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: Rscript .github/scripts/check-readme.R
        shell: bash
      - name: Exercise native Bayesian model adapters
        if: matrix.config.native
        env:
          REPAIR_RUN_STAN_TESTS: 'true'
        run: >-
          Rscript -e '.libPaths(c(normalizePath("check/repair.Rcheck"), .libPaths()));
          library(repair); testthat::test_file("tests/testthat/test-bayes-plugin-native.R",
          reporter = "summary", stop_on_failure = TRUE)'
        shell: bash

  package-checks:
    name: Package checks
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix check to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
        shell: bash
