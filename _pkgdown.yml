url: https://hallquistlab.github.io/repair/

template:
  bootstrap: 5
  light-switch: true

home:
  title: Measurement-error-corrected regression of random coefficients in R
  description: >
    Fit REPAIR structural regressions using random coefficients from lme4 or
    nlme models. Inspect scores, preserve their error covariance, report
    coefficients, and assess reliability with executable guides.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/repair-workflow.html

