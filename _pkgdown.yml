url: https://hallquistlab.github.io/repair/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    fg: "#323232"
    bg: "white"
    primary: "#719FC6"
    navbar-light-bg: "#719FC6"
    navbar-dark-bg: "#719FC6"

home:
  title: "Home"
  description: >
    Random-Effect Prediction Adjustment for Inference in Regression (REPAIR)
    estimates relationships involving unit-specific change and other processes
    from mixed models, accounting for shrinkage and sampling error in their
    predictions.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/repair-workflow.html
  bg: "#719FC6"
  type: light

